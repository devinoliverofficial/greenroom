<style>
/* ============================== Tokens ==============================
   Black is the default: on an OLED phone the card edges disappear and the
   money is the only lit thing on screen. Light stays a tap away. */
:root {
  --bg: #000000;
  --surface: #0C0F02;
  --surface-2: #161A07;
  --ink: #F1F4E3;
  --ink-2: #8F947B;   /* quiet: labels, captions, anything that is not money */
  --ink-3: #626750;
  --line: #1F2408;
  --line-2: #151805;
  --brand: #CCF80A;
  --on-brand: #121500;
  --pos: #CCF80A;
  --neg: #FF5F57;
  --pos-soft: rgba(204, 248, 10, .12);
  --neg-soft: rgba(255, 95, 87, .11);
  --hero-red: #150908;
  --hero-green: #1B2202;
  --scrim: rgba(0, 0, 0, .74);
  --ring: rgba(204, 248, 10, .3);
  --shadow: 0 1px 2px rgba(0, 0, 0, .6), 0 10px 30px rgba(0, 0, 0, .45);
  --glow-fade: 56%;
  --fill-a: .24;
  --font: "Inter", -apple-system, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --font-num: "Space Grotesk", "Inter", -apple-system, system-ui, sans-serif;
  color-scheme: dark;
}
/* The toggle's second look is the ORIGINAL Greenroom — the black-and-mint
   the app was born with. One theme class re-skins everything, including the
   band and the inverted cards, back to that first palette and its own mark. */
:root[data-theme="light"] {
  --bg: #000000;
  --surface: #0B100D;
  --surface-2: #141A16;
  --ink: #ECF2ED;
  --ink-2: #869189;   /* quiet: labels, captions, anything that is not money */
  --ink-3: #5C6761;
  --line: #1A211C;
  --line-2: #131916;
  --brand: #16C16C;
  --on-brand: #00150B;
  --pos: #2BE38C;
  --neg: #FF5F57;
  --pos-soft: rgba(43, 227, 140, .11);
  --neg-soft: rgba(255, 95, 87, .11);
  --hero-red: #150908;
  --hero-green: #032218;
  --scrim: rgba(0, 0, 0, .74);
  --ring: rgba(43, 227, 140, .3);
  --shadow: 0 1px 2px rgba(0, 0, 0, .6), 0 10px 30px rgba(0, 0, 0, .45);
  --glow-fade: 56%;
  --fill-a: .24;
  color-scheme: dark;
}
:root[data-theme="light"] .headband {
  --surface: #0B100D; --surface-2: #141A16;
  --ink: #ECF2ED; --ink-2: #869189; --ink-3: #5C6761;
  --line: #1A211C; --line-2: #131916;
  --pos: #2BE38C; --neg: #FF5F57;
  --pos-soft: rgba(43, 227, 140, .11);
  background: none; color: var(--ink);
}
:root[data-theme="light"] .tour-card,
:root[data-theme="light"] .opt-card,
:root[data-theme="light"] .venue-hero,
:root[data-theme="light"] .hero,
:root[data-theme="light"] .inv-card {
  --surface: #0B100D; --surface-2: #141A16;
  --ink: #ECF2ED; --ink-2: #869189; --ink-3: #5C6761;
  --line: #1A211C; --line-2: #131916;
  --pos: #2BE38C; --neg: #FF5F57;
  --pos-soft: rgba(43, 227, 140, .11); --neg-soft: rgba(255, 95, 87, .11);
  --hero-red: #150908; --hero-green: #032218;
  --ring: rgba(43, 227, 140, .3);

/* ============================== Base ============================== */
*, *::before, *::after { box-sizing: border-box; }
/* touch-action: manipulation kills double-tap-to-zoom. Pinch still works. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
body { touch-action: manipulation; }
body {
  margin: 0;
  padding: env(safe-area-inset-top, 0px) 0 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
button, input, textarea, select { font-family: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.file-hidden { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ic { display: inline-flex; flex: none; }
.ic svg { display: block; }

/* Heavy, slightly condensed numerals for money. */
.num { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.015em; }

h1, h2, h3 { font-weight: 650; letter-spacing: -.018em; line-height: 1.12; margin: 0; }

/* ============================== Layout ============================== */
.page { max-width: 600px; margin: 0 auto; padding: 4px 18px 72px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px; }
.topbar-actions { display: flex; align-items: center; gap: 4px; }

.logo-mark.top { width: 41px; height: 31px; }
/* The mark rides the centre of every screen's header. */
.topbar, .wz-meta { position: relative; }
.logo-mark.bar {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 32px; height: 24px; pointer-events: none;
}
.splash { display: grid; place-items: center; gap: 14px; padding: 18vh 0 0; }
.splash .logo-mark { width: 79px; height: 60px; }
.splash-name { font-size: 17px; font-weight: 650; letter-spacing: -.01em; color: var(--ink-2); }
.pill {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 11px; white-space: nowrap;
}

/* ============================== Buttons ============================== */
.btn {
  appearance: none; -webkit-appearance: none; border: 0; border-radius: 14px;
  min-height: 52px; padding: 0 20px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 650; line-height: 1.1;
  color: var(--ink); background: transparent; cursor: pointer; text-align: center;
  transition: transform .12s ease, background-color .15s ease;
}
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.ghost { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.btn.quiet { background: var(--surface-2); }
.btn.danger { color: var(--neg); box-shadow: inset 0 0 0 1.5px currentColor; }
.btn.danger-solid { background: var(--neg); color: #fff; }
.btn.sm { min-height: 42px; padding: 0 14px; font-size: 15px; border-radius: 11px; }
.btn.block { display: flex; width: 100%; }
.btn:disabled { opacity: .42; cursor: default; }
.btn:not(:disabled):active { transform: scale(.985); }
.stack { display: grid; gap: 10px; margin-top: 18px; }
.btnrow { display: flex; gap: 10px; margin: 0 0 18px; }
.btnrow .btn { flex: 1; min-width: 0; }
.iconbtn {
  appearance: none; border: 0; background: none; color: var(--ink);
  min-width: 44px; min-height: 44px; padding: 0 8px;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  border-radius: 11px; font-size: 16px; font-weight: 700; cursor: pointer;
}
.iconbtn.back { margin-left: -10px; padding-right: 12px; color: var(--pos); }
.iconbtn.back span {
  font-family: "Silkscreen", "Space Grotesk", monospace;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  max-width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.iconbtn.sm { min-width: 40px; min-height: 40px; color: var(--ink-3); }
.linkbtn {
  appearance: none; border: 0; background: none; padding: 0; min-height: 44px;
  color: var(--brand); font-size: 15px; font-weight: 700;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}

/* The pixel add-buttons: same green, same 8-bit voice as the logo. */
.add-mini {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 4px 10px 4px 2px; margin: 2px 0 14px;
  font-family: "Silkscreen", "Space Grotesk", monospace;
  font-size: 12px; font-weight: 700; letter-spacing: .08em;
  color: var(--pos); text-transform: uppercase;
}
.add-mini .plus { font-size: 15px; line-height: 1; transform: translateY(-1px); }
.add-mini:active { transform: translateY(1px); }

/* The one all-caps element, by request. */
.add-tour {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; min-height: 72px; margin: 6px 0 24px;
  border: 0; border-radius: 18px; background: var(--brand); color: var(--on-brand);
  font-size: 20px; font-weight: 800;
  letter-spacing: .1em; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .12s ease;
}
.add-tour:active { transform: scale(.99); }

/* ============================== Home ============================== */
.tour-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tour-card {
  position: relative; display: block; width: 100%; overflow: hidden; text-align: left;
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 16px 22px;
  cursor: pointer; box-shadow: var(--shadow);
}
/* Artist and tour rows carry no card: just the name on the black. */
.tour-card.name-card {
  background: none; border: 0; box-shadow: none; border-radius: 12px;
  padding: 10px 6px 10px 4px;
}
.tour-card.name-card::before { display: none; }
.tour-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--state); }
.tour-card.red { --state: var(--neg); }
.tour-card.green { --state: var(--pos); }
.tour-card.idle { --state: var(--line); }
.tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.tc-top .ic { color: var(--ink-3); margin-top: 3px; }
.tour-card.name-card { padding: 18px 16px 18px 22px; }
.tour-card.name-card .tc-top .ic { margin-top: 1px; }
.tc-name { font-size: 20px; font-weight: 650; line-height: 1.16; letter-spacing: -.015em; overflow-wrap: anywhere; }
.tc-meta { margin-top: 3px; font-size: 14px; color: var(--ink-2); }
.tc-num { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 10px; margin-top: 12px; }
.tc-big { font-size: 30px; color: var(--state); line-height: 1.05; }
.tour-card.idle .tc-big { color: var(--ink-3); }
.tc-cap { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.tc-foot { margin-top: 9px; font-size: 13px; font-weight: 600; color: var(--ink-3); }

.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 4px 0 14px; padding: 11px 12px 11px 15px; border-radius: 13px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
  font-size: 14px; font-weight: 500;
}
.empty { padding: 26px 2px 10px; }
.empty h3 { font-size: 19px; margin-bottom: 6px; }
.empty p { margin: 0; color: var(--ink-2); max-width: 46ch; }
.home-foot { margin: 26px 2px 0; display: grid; gap: 2px; justify-items: start; }
.home-foot .linkbtn { min-height: 32px; }
.note { margin: 10px 2px 0; font-size: 14px; color: var(--ink-2); }
.tour-title { margin: 2px 0 14px; font-size: 29px; overflow-wrap: anywhere; }

/* Six tabs along the bottom: icon over label, the live one lit. */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in oklab, var(--bg), transparent 8%);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar-b {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: grid; justify-items: center; gap: 3px; padding: 6px 2px 4px;
  color: var(--ink-3); font: inherit;
}
.tabbar-b span {
  font-size: 10px; font-weight: 650; letter-spacing: -.005em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.tabbar-b .ic { opacity: .85; }
.tabbar-b.on { color: var(--pos); }
.tabbar-b.on .ic { opacity: 1; }
.page.has-tabs { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* The inverted cards: the logo's black fields floating on the green.
   Re-scoping the tokens flips everything inside — ink, lines, chips, charts.
   Red stays red (brightened for the dark ground) so the money story holds. */
.tour-card, .opt-card, .venue-hero, .hero, .inv-card {
  --surface: #0C0E00; --surface-2: #1B2004;
  --ink: #CCF80A; --ink-2: #A6C41F; --ink-3: #7E960F;
  --line: #2A3305; --line-2: #21280A;
  --pos: #CCF80A; --neg: #FF5F57;
  --pos-soft: rgba(204, 248, 10, .14); --neg-soft: rgba(255, 95, 87, .16);
  --hero-red: #1B0A04; --hero-green: #141B01;
  --ring: rgba(204, 248, 10, .35);
  --glow-fade: 56%; --fill-a: .22;
  color: var(--ink);
}

/* The black head: one straight-edged black field capping each page, cut at a
   different depth per page (under the pixel add button, the Share row, or the
   tour name). Inside it the GR mark and pixel controls go chartreuse. */
.headband {
  --surface: #CCF80A; --surface-2: #C3ED0A;
  --ink: #0C0E00; --ink-2: #3A4201; --ink-3: #5D6704;
  --line: #A9CE08; --line-2: #B4DA09;
  --pos: #0C0E00; --neg: #C21F15;
  --pos-soft: rgba(12, 14, 0, .08);
  background: #CCF80A; color: var(--ink);
  position: relative; margin: -4px -18px 34px; padding: 2px 18px 10px;
}
/* The band doesn't stop, it dissolves: a strip of green fading into the black
   hangs below it, so the content still sits on solid colour. */
.headband::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -30px; height: 30px;
  background: linear-gradient(180deg, #CCF80A 0%, rgba(204, 248, 10, .45) 46%, rgba(204, 248, 10, 0) 100%);
  pointer-events: none;
}
:root[data-theme="light"] .headband::after { display: none; }

  display: block; width: min(62vw, 270px); height: auto;
  aspect-ratio: 322 / 243; margin: 44px auto 0;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  opacity: .1; pointer-events: none;
}

/* The artists list, in the shape of a good stock app: a section title, then
   a row per act — mark, name, and a pill that jumps straight to their run. */
.sec-head { margin: 4px 2px 14px; }
.sec-title { font-size: 30px; font-weight: 800; letter-spacing: -.022em; line-height: 1.1; }
.sec-sub { margin: 3px 0 0; font-size: 16px; font-weight: 500; color: var(--ink-3); }

/* Grid items size to their content unless told otherwise — without this the
   artist rows push the Tours pill off the screen. */
.tour-list > li { min-width: 0; }
.tour-card.art-row {
  display: flex; align-items: center; gap: 6px; overflow: hidden;
  padding: 12px 12px 12px 14px; cursor: default;
}
.art-main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
  appearance: none; border: 0; background: none; padding: 0; margin: 0;
  color: inherit; font: inherit; cursor: pointer; min-height: 52px;
}
/* The band name sits centred between the mark and the arrow, in the green. */
.art-main .tc-name {
  flex: 1; min-width: 0; text-align: center;
  font-size: 19px; font-weight: 700; letter-spacing: -.021em; line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.art-main .ic { flex: none; color: var(--ink-3); }
/* The slot left of the name: a + until a logo lands, then the mark itself. */
.logo-slot {
  flex: none; appearance: none; cursor: pointer; padding: 0; overflow: hidden;
  width: 42px; height: 42px; border-radius: 12px;
  display: grid; place-items: center;
  border: 1px dashed var(--line); background: var(--surface-2);
  color: var(--ink-3); font: inherit; font-size: 21px; font-weight: 500; line-height: 1;
}
.logo-slot.has { border-style: solid; border-color: transparent; background: none; }
.logo-slot .brand-logo { width: 42px; height: 42px; border-radius: 12px; margin: 0; object-fit: cover; vertical-align: 0; }
.logo-slot:active { border-color: var(--pos); color: var(--pos); }
.row-pill {
  flex: none; appearance: none; border: 0; cursor: pointer;
  padding: 0 17px; min-height: 44px; border-radius: 999px;
  background: var(--surface-2); color: #FFFFFF;
  font: inherit; font-size: 15px; font-weight: 700;
}
.row-pill:active { transform: translateY(1px); }

/* Artist logos: small in the bubbles, a touch bigger by the name. */
.tc-artist { display: flex; align-items: center; gap: 12px; }
.artist-logo { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; flex: none; }
.artist-title { display: flex; align-items: center; gap: 12px; }
.artist-title .artist-logo { width: 44px; height: 44px; }
.linkbtn.logo-import { min-height: 34px; font-size: 13px; color: var(--ink-3); text-decoration: none; display: block; }

/* Recently deleted: a whisper in the corner. */
.home-corner { display: flex; justify-content: flex-end; gap: 22px; margin-top: 34px; }
.home-corner .linkbtn {
  font-size: 12px; font-weight: 600; color: var(--ink-3);
  text-decoration: none; min-height: 32px;
}

/* ============================== The hero ============================== */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 22px 18px 18px;
  border: 1px solid var(--line); box-shadow: var(--shadow);
  /* Tint walks from soft red to soft green as coverage grows. */
  background: var(--hero-red);
  transition: background-color .6s ease;
}
@supports (background: color-mix(in oklab, red, blue 50%)) {
  .hero { background: color-mix(in oklab, var(--hero-red), var(--hero-green) var(--cov, 0%)); }
}
.hero.idle { background: var(--surface); }
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

/* Odometer */
.odo {
  display: flex; align-items: flex-end; overflow: hidden;
  font-size: clamp(54px, 17.5vw, 78px); line-height: 1.02; color: var(--state, var(--ink));
  font-family: var(--font-num); font-weight: 700; letter-spacing: -.035em;
  padding: 2px 0 4px;
  transform-origin: left center;
}
.hero.celebrate .odo { animation: pop .7s cubic-bezier(.22, 1.4, .3, 1) 1; }
@keyframes pop { 0% { transform: scale(1); } 32% { transform: scale(1.07); } 100% { transform: scale(1); } }
.hero.red .odo { --state: var(--neg); }
.hero.green .odo { --state: var(--pos); }
.hero.idle .odo { --state: var(--ink-3); }
/* A halo on the whole number, like a lit sign. It has to be a filter rather than
   a text-shadow: each digit column clips its own overflow, which would slice a
   shadow into rectangles. --glow-fade is 100% in light mode, so it disappears. */
.odo { filter: drop-shadow(0 0 13px color-mix(in oklab, var(--state, transparent), transparent var(--glow-fade))); }
.odo-c { display: block; flex: none; }
.odo-d { position: relative; height: 1.02em; overflow: hidden; }
.odo-strip { display: flex; flex-direction: column; transition: transform .62s cubic-bezier(.22, .9, .18, 1); transition-delay: calc(var(--i, 0) * 45ms); }
.odo-strip > span { display: block; height: 1.02em; }
.hero-cap { margin-top: 2px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
/* Scrubbing turns the caption into the day's take, rolling like the number. */
.hero-cap.cap-odo {
  display: flex; align-items: flex-end; overflow: hidden;
  font-family: var(--font-num); font-weight: 700; font-size: 19px;
  letter-spacing: -.01em; color: var(--pos); line-height: 1.15;
}
.hero-cap.cap-odo .odo-d { height: 1.15em; }
.hero-cap.cap-odo .odo-strip > span { height: 1.15em; }

/* Comments beside the big number while scrubbing. */
/* One fixed row under the number: the day's take left, its comment right.
   Fixed height and one line each, so scrubbing never moves the layout. */
.cap-row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; min-height: 26px; margin-top: 2px;
}
.cap-row .hero-cap { flex: none; margin-top: 0; }
.hero-note {
  flex: 1; min-width: 0; text-align: right;
  font-size: 15px; font-weight: 600; line-height: 26px; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hero-cap.cap-odo .odo-c { white-space: pre; }

.change-chip {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
  padding: 6px 12px; border-radius: 999px; background: var(--surface);
  border: 1px solid var(--line); font-size: 14px; font-weight: 600;
  color: var(--ink-2); max-width: 100%;
}
.change-chip b { font-weight: 800; }
.change-chip { color: var(--ink-3); }
.change-chip.up b { color: var(--pos); }
.change-chip.down b { color: var(--neg); }
.change-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* While scrubbing, the chip would read as if it belonged to the night under your finger. */
.hero.scrubbing .change-chip { opacity: 0; transition: opacity .12s ease; }

/* Chart — the centrepiece */
/* touch-action:none — dragging the chart must never scroll the page. */
.chart-wrap { position: relative; margin: 18px 0 2px; touch-action: none; cursor: crosshair; }
.chart-wrap:focus { outline: none; }
.chart-wrap:focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; border-radius: 10px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart .baseline { stroke: var(--ink-3); stroke-width: 1.25; stroke-dasharray: 5 5; opacity: .7; }
.chart .curve { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .curve.pos { stroke: var(--pos); }
.chart .curve.neg { stroke: var(--neg); }
/* Red over chartreuse mixes to mustard, so underwater shades in ink — except
   inside the black hero card, where the red fill reads true. */
.chart .fill-neg { fill: var(--ink); opacity: .09; }
.hero .chart .fill-neg { fill: var(--neg); opacity: var(--fill-a); }
.chart .fill-pos { fill: var(--pos); opacity: var(--fill-a); }
/* A 2px surface ring keeps each night's mark off the line it sits on. */
.chart .night { fill: var(--surface); stroke-width: 2.5; }
.chart .night.pos { stroke: var(--pos); }
.chart .night.neg { stroke: var(--neg); }
.chart .head { stroke: var(--surface); stroke-width: 2.5; }
.chart .head.pos { fill: var(--pos); }
.chart .head.neg { fill: var(--neg); }
.chart .cursor { stroke: var(--ink-2); stroke-width: 1.25; opacity: 0; }
.chart .dot { fill: var(--surface); stroke-width: 3; opacity: 0; }
.chart .dot.pos { stroke: var(--pos); }
.chart .dot.neg { stroke: var(--neg); }
.chart-wrap.scrubbing .cursor, .chart-wrap.scrubbing .dot { opacity: 1; }
.chart-wrap.scrubbing .head { opacity: .3 !important; }
.chart-ends { display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
/* A small chip so the dashed line doesn't run straight through the words. */
.break-even {
  position: absolute; right: 6px; transform: translateY(-50%);
  padding: 1px 6px 2px; border-radius: 5px; background: var(--surface);
  font-size: 11px; font-weight: 600; color: var(--ink-3);
  pointer-events: none; letter-spacing: .01em;
}
/* Pinned to the top of the chart so a thumb on the line never covers it. */
/* The pill above the line carries that night's comment. */
.scrub-pill {
  position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  padding: 6px 13px; border-radius: 999px; background: var(--pos); color: var(--on-brand);
  font-size: 12.5px; font-weight: 650; box-shadow: 0 0 18px color-mix(in oklab, var(--pos), transparent 62%);
  max-width: 88%; overflow: hidden; text-overflow: ellipsis;
}
.scrub-pill b { font-weight: 800; opacity: .75; }

/* The comments that ride under the balance line while you scrub. */
.scrub-notes { display: none; }
.sn-bubble {
  padding: 6px 13px; border-radius: 999px;
  background: var(--pos); border: 0; color: var(--on-brand);
  font-size: 13px; font-weight: 650; line-height: 1.32; text-align: center;
  max-width: 100%; white-space: normal; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  box-shadow: 0 0 20px color-mix(in oklab, var(--pos), transparent 62%), 0 3px 10px rgba(0, 0, 0, .35);
  animation: snpop .22s cubic-bezier(.22, 1.4, .3, 1);
}
.sn-bubble b { font-weight: 800; opacity: .72; }
@keyframes snpop { from { opacity: 0; transform: translateY(7px) scale(.88); } }

/* Pins mark the nights that already have something said about them. */
.note-pins { position: absolute; left: 0; right: 0; bottom: 30px; height: 0; pointer-events: none; }
.note-pin {
  position: absolute; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%;
  background: var(--pos); box-shadow: 0 0 10px color-mix(in oklab, var(--pos), transparent 45%);
  animation: pinbeat 2.4s ease-in-out infinite;
  transition: transform .16s ease;
}
.note-pin.on { transform: scale(2.1); }
@keyframes pinbeat { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .sn-bubble { animation: none; }
  .note-pin { animation: none; opacity: .9; }
}

/* Progress */
.prog { margin-top: 16px; }
.prog-track { height: 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.prog-fill { height: 100%; width: 0; border-radius: 999px; background: var(--neg); transition: width .6s cubic-bezier(.22,.9,.18,1), background-color .45s ease; }
.prog-cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; margin-top: 9px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.prog-cap .num { font-weight: 700; }

#confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; }

/* ============================== Tabs ============================== */
.tabs { display: flex; gap: 2px; margin: 22px 0 16px; border-bottom: 1.5px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 1 auto; appearance: none; border: 0; background: none; margin-bottom: -1.5px;
  padding: 12px 6px 10px; border-bottom: 3px solid transparent;
  font-size: 15px; font-weight: 600; line-height: 1.15;
  color: var(--ink-3); cursor: pointer; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pos); }

/* ============================== Shows ============================== */
.count-line { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.shows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.show-row {
  display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; align-items: center; gap: 14px;
  width: 100%; padding: 13px 2px; border: 0; border-bottom: 1px solid var(--line);
  background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.show-row .ic { color: var(--ink-3); }
.date { text-align: center; line-height: 1; }
.date .m { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: none; }
.date .d { margin: 3px 0 2px; font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
.date .w { font-size: 12px; color: var(--ink-3); }
.where { min-width: 0; }
.city { font-size: 17px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.venue { margin-top: 2px; font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { display: inline-block; padding: 4px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.tag.attn { background: var(--surface-2); color: var(--ink-2); }
.tag.quiet { background: none; color: var(--ink-3); font-weight: 500; padding-right: 0; }
.show-row.is-today .d { color: var(--pos); }
/* Travel and off days sit in the schedule but never beg for a tap. */
.show-row.is-off { cursor: default; opacity: .55; }
.show-row.is-off .city { font-weight: 500; color: var(--ink-2); }
.tonight {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  margin: 0 0 16px; padding: 14px 14px 14px 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 18px;
}
/* A small green dot is enough to say "this is the one that matters tonight". */
.tn-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tn-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pos); }
.tn-city { font-size: 20px; font-weight: 650; line-height: 1.16; overflow-wrap: anywhere; }
.tonight .btn { flex: none; }

/* ============================== Ledger rows ============================== */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.ledger + .ledger { margin-top: 14px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 9px 15px; border-bottom: 1px solid var(--line-2); }
.row:last-child { border-bottom: 0; }
.row-label { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.row-label label { cursor: pointer; }
.hint { display: block; font-size: 13px; font-weight: 450; color: var(--ink-3); }
.hint.over { color: var(--neg); font-weight: 600; }
.hint.done { color: var(--pos); font-weight: 600; }
.row.bd-row { min-height: 44px; padding-top: 4px; padding-bottom: 4px; }
.row.bd-row .row-label { font-size: 14px; font-weight: 500; color: var(--ink-2); }
.row.bd-row .amt { font-size: 14px; }
.note.over-note { color: var(--neg); }
.row.sn-row { min-height: 44px; }
.row.sn-row .row-label { font-size: 14px; font-weight: 500; color: var(--ink-2); }
.sn-val { font-size: 14px; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
/* Day sheet */
.ds-nav { display: flex; align-items: center; gap: 6px; }
.ds-where { flex: 1; min-width: 0; text-align: center; }
.ds-city { font-size: 19px; font-weight: 650; display: inline-flex; align-items: center; gap: 7px; }
.ds-tonight { width: 8px; height: 8px; border-radius: 50%; background: var(--pos); display: inline-block; }
/* Overview: the TM's message wears a small label; pre-sale stands centred. */
.ov-msg-k {
  display: block; margin: 20px 2px 6px; font-size: 12px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
}
.ov-msg .ov-quote { margin-top: 4px; }
.ov-presale { text-align: center; margin: 22px 0 6px; }
.ov-presale .ov-msg-k { margin: 0 0 4px; }
.ov-presale-n { display: block; font-size: 36px; font-weight: 800; letter-spacing: -.02em; color: var(--pos); }

/* Day sheet rows: the labels in white, the information in green. */
.row.ds-row { min-height: 50px; }
.ds-row .row-label { color: var(--ink); }
.ds-row .ds-time, .ds-row .ds-val { color: var(--pos); }
.ds-time { font-size: 17px; white-space: nowrap; }
.ds-val { font-size: 14px; font-weight: 600; text-align: right; max-width: 60%; overflow-wrap: anywhere; }
/* The bus chat: author in green, words in white, time in a whisper. */
.chat-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.chat-msg { padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.chat-top { display: flex; align-items: center; gap: 8px; }
.chat-a { font-size: 12.5px; font-weight: 700; color: var(--pos); }
.chat-t { font-size: 11px; color: var(--ink-3); }
.chat-x { margin-left: auto; }
.chat-b { margin-top: 3px; font-size: 15px; line-height: 1.45; color: var(--ink); overflow-wrap: anywhere; }
.chat-form { display: flex; gap: 8px; margin-top: 16px; }
.chat-form .input { flex: 1; min-width: 0; }

.ds-amens { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ds-amen { padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.ds-amen.yes { background: var(--pos-soft); color: var(--pos); }
.ds-amen.no { background: var(--surface-2); color: var(--ink-3); }
.ds-drive { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 13px 15px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.ds-drive strong { font-size: 17px; }
.ds-yns { display: grid; gap: 8px; margin-bottom: 14px; }
.ds-yn { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.guest-pass { flex: none; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 700; white-space: nowrap; }
.guest-pass.aa { background: var(--pos-soft); color: var(--pos); }

/* Swipe to delete */
.swipe-wrap { position: relative; border-radius: 18px; overflow: hidden; touch-action: pan-y; }
.swipe-del {
  position: absolute; top: 0; bottom: 0; right: 0; width: 116px; border: 0;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 26px;
  background: var(--neg); color: #fff; font-size: 15px; font-weight: 700;
  border-radius: 18px; cursor: pointer;
  opacity: 0; transition: opacity .15s ease; pointer-events: none;
}
.swipe-wrap.revealed .swipe-del { opacity: 1; pointer-events: auto; }
.swipe-card { position: relative; z-index: 1; transition: transform .22s cubic-bezier(.2,.8,.2,1); }

/* The two-door tour menu */
.opt-cards { display: grid; gap: 12px; margin-top: 6px; }
.opt-card {
  position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 20px; padding: 20px 48px 20px 20px;
  box-shadow: var(--shadow);
}
.opt-card .ic { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.opt-title { font-size: 22px; font-weight: 650; letter-spacing: -.015em; }
/* The line under each door: small green italic, full strength. */
.opt-sub { margin-top: 6px; font-size: 13px; font-style: italic; color: var(--pos); }
.opt-sub b { font-weight: 650; }
.opt-card.red .opt-net { color: var(--neg); }
.opt-card.green .opt-net { color: var(--pos); }

/* The details centerpiece: where and when */
/* The night itself, given room: no card, no border, just air around it. */
.venue-hero {
  display: flex; align-items: center; gap: 4px; text-align: center;
  border: 0; background: none; box-shadow: none; border-radius: 0;
  padding: 10px 0 14px;
}
.vh-mid { flex: 1; min-width: 0; }
.vh-arrow { flex: none; }
.vh-date { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.vh-tonight { padding: 2px 9px; border-radius: 999px; background: var(--pos-soft); color: var(--pos); font-size: 12px; font-weight: 700; }
.vh-when { padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.brand-logo { width: 20px; height: 20px; border-radius: 5px; vertical-align: -4px; margin-right: 2px; }
.sh-h3 .brand-logo { margin-right: 7px; }
.vh-soldout { padding: 2px 9px; border-radius: 999px; background: var(--neg-soft); color: var(--neg); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
/* The city: the centerpiece, big and green in the clean font. */
.vh-city { margin-top: 7px; font-size: clamp(26px, 7.4vw, 32px); font-weight: 700; letter-spacing: -.026em; line-height: 1.08; color: var(--pos); overflow-wrap: anywhere; }
.vh-venue { margin-top: 5px; font-size: 14px; font-weight: 500; color: var(--ink-3); overflow-wrap: anywhere; }

/* Overview: tonight, in as few marks as possible. */
.ov-today { text-align: center; padding: 18px 0 20px; }
.ov-when { display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--ink-3); }
.ov-city { margin-top: 8px; font-size: clamp(30px, 8.6vw, 38px); font-weight: 700;
  letter-spacing: -.028em; line-height: 1.06; color: var(--pos); overflow-wrap: anywhere; }
.ov-venue { margin-top: 6px; font-size: 16px; font-weight: 500; color: var(--ink-2); overflow-wrap: anywhere; }
.ov-lines { display: grid; gap: 1px; }
.ov-line { display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
  padding: 13px 2px; border-bottom: 1px solid var(--line-2); }
.ov-line:last-child { border-bottom: 0; }
.ov-k { font-size: 14px; font-weight: 600; color: var(--ink-3); }
.ov-v { min-width: 0; text-align: right; font-size: 16px; font-weight: 650; color: var(--ink); overflow-wrap: anywhere; }
.ov-quote { margin: 20px 0 0; padding: 0 0 0 16px; border-left: 3px solid var(--pos); }
.ov-quote p { margin: 0; font-size: 17px; font-weight: 500; font-style: italic; line-height: 1.45; color: var(--ink); }

/* The dates rail under it */
.ds-rail { display: flex; gap: 7px; overflow-x: auto; padding: 4px 2px 2px; scrollbar-width: none; }
.ds-rail::-webkit-scrollbar { display: none; }
.ds-chip {
  flex: none; display: grid; justify-items: center; gap: 1px; min-width: 46px;
  padding: 6px 8px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--surface); color: var(--ink); font: inherit; cursor: pointer;
}
.ds-chip-d { font-size: 15px; font-weight: 700; }
.ds-chip-c { font-size: 10.5px; max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-chip.on { border-color: var(--pos); color: var(--ink); }
.ds-chip.tonight .ds-chip-d { color: var(--pos); }
/* OVERVIEW's toolbar: both buttons speak in the same white. */
.ov-actions .btn.ghost { color: var(--ink); }
.row.head { min-height: 0; padding: 13px 15px 7px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-3); }
.row.total { background: var(--surface-2); }
.row.total > span:first-child { flex: 1; font-weight: 700; }
.row.total .amt { font-size: 19px; }
.row.rowbtn { width: 100%; appearance: none; border: 0; border-bottom: 1px solid var(--line-2); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.row.rowbtn:last-child { border-bottom: 0; }
.row.rowbtn .ic { color: var(--ink-3); }
.row.stackrow { min-height: 0; padding: 0 15px 13px; margin-top: -6px; }
.row.stackrow .input { width: 100%; }
/* Which income streams a % deal comes out of */
.row.stackrow.cbase { display: flex; flex-wrap: wrap; gap: 6px; }
.cbase-chip {
  appearance: none; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
  padding: 6px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.cbase-chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
/* "Already accounted for?" under each charge's category */
.rv-acc { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.rv-acc-q { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.rv-row.accounted .rv-head .amt { text-decoration: line-through; opacity: .55; }
/* Guest list: pixel actions above the list, and the bulk-paste box */
.gl-actions { display: flex; gap: 20px; margin: 0 0 4px; }
.gl-actions .add-mini { margin-bottom: 6px; }
.gl-paste {
  width: 100%; min-height: 150px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 13px;
  background: var(--surface); color: var(--ink);
  font: inherit; font-size: 15px; line-height: 1.5; resize: none;
}
/* The atVenu bubble sits in the merch row, sized like the money input. */
.av-bubble {
  appearance: none; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface-2); cursor: pointer;
  flex: none; width: 54px; height: 46px;
  display: inline-flex; align-items: center; justify-content: center;
}
.av-bubble .brand-logo { width: 22px; height: 22px; margin: 0; vertical-align: 0; }
.av-bubble.reading { animation: avpulse 1s ease-in-out infinite; }
@keyframes avpulse { 50% { opacity: .45; } }
.ph-hint.known { color: var(--pos); font-weight: 600; }
.row-pair { display: flex; gap: 8px; flex: none; }
.comm-sub { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.comm-sub .hint { display: inline; }

/* ============================== Inputs ============================== */
.money-in {
  display: flex; align-items: center; gap: 3px; flex: none; width: 128px; height: 46px;
  padding: 0 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
}
.money-in:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
.money-in .cur { color: var(--ink-3); font-size: 15px; font-weight: 700; }
.money-in input {
  flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent;
  color: var(--ink); font-size: 17px; font-family: var(--font-num); font-weight: 600;
  text-align: right; font-variant-numeric: tabular-nums; padding: 0;
}
.money-in input::placeholder { color: var(--ink-3); opacity: .65; font-weight: 500; }
.money-in.big { flex: 1; width: auto; height: 58px; }
.money-in.big input { font-size: 25px; text-align: left; }
.money-in.slim { width: 104px; height: 44px; padding: 0 10px; }
.field .money-in { width: 100%; }
.seg { display: inline-flex; padding: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.seg-b { appearance: none; border: 0; background: transparent; min-width: 38px; min-height: 34px; border-radius: 8px; color: var(--ink-2); font-size: 15px; font-weight: 700; cursor: pointer; }
.seg-b[aria-checked="true"] { background: var(--brand); color: var(--on-brand); }
/* Steppers you can actually hit with a thumb on a moving bus. */
.seg.big { padding: 3px; border-radius: 13px; }
.seg.big .seg-b { min-width: 58px; min-height: 50px; font-size: 22px; color: var(--ink); }
.seg.big .seg-b:active { background: var(--surface); }
.input {
  display: block; width: 100%; height: 50px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 13px; background: var(--surface);
  color: var(--ink); font-size: 17px; font-weight: 600;
}
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
.input::placeholder { color: var(--ink-3); opacity: .85; font-weight: 500; }
.input.big { height: 58px; font-size: 22px; font-weight: 700; }
.input.sm { height: 44px; font-size: 16px; padding: 0 11px; border-radius: 11px; }
select.input { appearance: none; -webkit-appearance: none; background-image: none; }
.card .input, .card .money-in, .sheet .input, .sheet .money-in { background: var(--surface-2); }
.sheet .input { border-color: var(--line); }
.field { display: block; margin-bottom: 14px; }
.field-label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.field-row { display: flex; gap: 10px; }
.field-row > * { flex: 1; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip {
  appearance: none; min-height: 38px; padding: 0 14px; border: 1.5px solid var(--line);
  border-radius: 999px; background: var(--surface); color: var(--ink);
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 15px; }
.addform { margin-bottom: 18px; }
.addform .chips { margin: 10px 0 14px; }
.af-row { display: flex; gap: 10px; align-items: stretch; }
.af-row .input { flex: 1; min-width: 0; }
.af-row input[type="date"].input { flex: 0 0 152px; }

/* ============================== Day by day ============================== */
.section-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 4px 2px 12px; font-weight: 600; color: var(--ink-2); }
.section-total .amt { font-size: 19px; color: var(--ink); }
.daygroup { margin-bottom: 16px; }
.dg-head { display: flex; justify-content: space-between; gap: 12px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink-2); }
.dg-list { list-style: none; margin: 0; padding: 0; }
.dg-item { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 2px 0 2px 2px; border-bottom: 1px solid var(--line); }
.dg-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mini-tag { flex: none; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); font-size: 12px; font-weight: 700; }

/* ============================== Wizard ============================== */
.wz-head { padding-top: 14px; }
.wz-bar { display: flex; gap: 6px; }
.wz-bar i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.wz-bar i.on { background: var(--brand); }
.wz-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.wz-title { margin: 18px 0 8px; font-size: 30px; }
.wz-sub { margin: 0 0 18px; color: var(--ink-2); max-width: 46ch; }
.wz-foot {
  position: sticky; bottom: 0; z-index: 3; display: flex; gap: 10px; margin-top: 20px;
  padding: 16px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 26%);
}
.wz-foot .btn { flex: 1; }
.wz-foot .btn.primary { flex: 2; }
.running {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin: 0 0 16px; padding: 14px 16px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--line);
}
.running .amt { font-size: 26px; }
.running .lbl { font-size: 14px; font-weight: 600; color: var(--ink-2); }

/* ============================== Sheets ============================== */
#sheet-root { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .22s ease; }
#sheet-root.open .scrim { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 600px;
  max-height: calc(100% - 28px - env(safe-area-inset-top, 0px));
  overflow-y: auto; overscroll-behavior: contain; background: var(--bg);
  border-radius: 26px 26px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(104%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 -8px 40px rgba(14, 32, 25, .2); outline: none;
}
#sheet-root.open .sheet { transform: none; }
.sheet-x { position: absolute; top: 10px; right: 8px; }
.sh-title { margin: 2px 44px 8px 0; font-size: 23px; overflow-wrap: anywhere; }
.sh-sub { margin: 0 0 16px; color: var(--ink-2); }
.sh-p { margin: 0 0 12px; }
.sh-h3 { margin: 22px 0 6px; font-size: 17px; }
.sh-form .ledger { margin-bottom: 14px; }
.or-line {
  display: flex; align-items: center; gap: 10px; margin: 14px 0;
  font-size: 13px; font-weight: 500; color: var(--ink-3);
}
.or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sh-form .stack { margin-top: 4px; }
.preview {
  display: grid; gap: 7px; margin: 0 0 16px; padding: 13px 15px; border-radius: 14px;
  background: var(--surface-2); border: 1px solid var(--line);
}
.preview > div { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; color: var(--ink-2); }
.preview strong { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
.preview strong.pos { color: var(--pos); }
.preview strong.neg { color: var(--neg); }
/* Review lists — flyer dates and card charges */
.review { display: grid; gap: 10px; margin: 6px 0 4px; }
.rv-row {
  display: flex; align-items: flex-start; gap: 11px; padding: 12px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
}
.rv-row.off { opacity: .5; }
.rv-check { flex: none; width: 22px; height: 22px; margin: 9px 0 0; accent-color: var(--brand); }
.rv-fields { flex: 1; min-width: 0; display: grid; gap: 8px; }
.rv-line { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr); gap: 8px; }
.rv-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rv-name { min-width: 0; font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-sub { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
.rv-flag {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  font-size: 12px; font-weight: 600;
}
.rv-flag.learned { background: var(--pos-soft); color: var(--pos); }
select.input.slim { width: 148px; height: 42px; }

/* Reading a flyer or a statement takes a moment; this says so without lying about progress. */
/* ============================== The roadie ==============================
   Whenever the app is working — signing you in, reading a flyer, a
   settlement or an atVenu export — the bus drives. It bobs on its

@keyframes busbob {
  0%, 100% { transform: translateY(0) rotate(-.7deg); }
  50% { transform: translateY(-5px) rotate(.7deg); }
}
.busy-word {
  margin: 2px 0 20px; text-align: center;
  font-size: 15px; font-weight: 650; letter-spacing: .02em; color: var(--ink-2);
}
.rd-road {
  width: 188px; height: 4px; border-radius: 2px; opacity: .85;
  background-image: repeating-linear-gradient(90deg, var(--pos) 0 18px, transparent 18px 36px);
  background-size: 36px 4px;
  animation: rdmove .42s linear infinite;
}
@keyframes rdmove { to { background-position: -36px 0; } }
@media (prefers-reduced-motion: reduce) {
  .bus-mark, .rd-road { animation: none; }
}

textarea.update {
  display: block; width: 100%; margin: 6px 0 12px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 13px; background: var(--surface);
  color: var(--ink); font-size: 15px; font-weight: 500; line-height: 1.55; resize: none;
}

/* ============================== Splash ==============================
   The full logo flashes on open, on the artwork's own near-black so the
   image has no visible edges, then hands over to the app. */
#gr-splash {
  position: fixed; inset: 0; z-index: 120; background: #CCF80A;
  display: grid; place-items: center;
  opacity: 1; transition: opacity .4s ease;
}
#gr-splash.off { opacity: 0; pointer-events: none; }
#gr-splash img { width: min(78vw, 560px); height: auto; }

/* ============================== Sign-in gate + people ============================== */
#gr-gate {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: grid; place-items: start center; padding: 16vh 22px 0;
}
.gate-card { display: grid; justify-items: center; gap: 10px; max-width: 380px; text-align: center; }
.gate-card .logo-mark { background-size: contain; background-repeat: no-repeat; background-position: center; }
.gate-card h2 { font-size: 24px; }
/* The bus rides under the GR mark on the sign-in page, larger than it. */
/* The GR mark carries the sign-in screen on its own. */
.gate-mark { width: 132px; height: 100px; margin: 0 auto 18px; }
.gate-card p { margin: 0 0 8px; color: var(--ink-2); }
.gate-card form { display: grid; gap: 10px; width: 100%; }
.gate-card .linkbtn { margin-top: 6px; }
.gate-card .linkbtn.quiet { color: var(--ink-3); text-decoration: none; min-height: 36px; }
.gate-err { min-height: 20px; font-size: 14px; color: var(--neg); text-align: left; }
.people-row { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.people-row .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.people-row .role-tag { flex: none; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; font-weight: 700; letter-spacing: .05em; }
.people-row .role-tag.aa { background: var(--pos-soft); color: var(--pos); }

/* ============================== The closeout report ==============================
   Paper, not app: white, serif-free, printable. */
#gr-report {
  position: fixed; inset: 0; z-index: 140; overflow-y: auto;
  background: #FFFFFF; color: #111827;
  font-family: "Inter", -apple-system, Helvetica, Arial, sans-serif;
  padding: 0 0 60px;
}
#gr-report section, #gr-report header, #gr-report footer { max-width: 720px; margin: 0 auto; padding: 0 22px; }
.rp-bar { position: sticky; top: 0; display: flex; justify-content: space-between; gap: 10px;
  padding: 10px 16px calc(10px); background: #F3F4F6; border-bottom: 1px solid #E5E7EB; }
.rp-head { padding-top: 26px; }
.rp-kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #6B7280; }
#gr-report h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; color: #111827; }
.rp-sub { color: #4B5563; margin: 0 0 8px; }
#gr-report h2 { font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: #111827; margin: 28px 0 10px; padding-top: 14px; border-top: 2px solid #111827; }
#gr-report h3 { font-size: 13px; font-weight: 700; margin: 14px 0 6px; color: #374151; }
.rp-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.rp-card { border: 1px solid #E5E7EB; border-radius: 10px; padding: 10px 12px; }
.rp-card span { display: block; font-size: 12px; color: #6B7280; }
.rp-card strong { font-size: 20px; font-variant-numeric: tabular-nums; }
.rp-pos { color: #047857; } .rp-neg { color: #B91C1C; }
.rp-table { width: 100%; border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
.rp-table thead, .rp-table tbody { display: table; width: 100%; }
.rp-table td { padding: 6px 8px; border-bottom: 1px solid #E5E7EB; vertical-align: top; }
.rp-table thead td { font-weight: 700; color: #374151; border-bottom: 2px solid #111827; }
.rp-l { text-align: left; } .rp-n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-table .rp-l { text-align: left; }
.rp-total td { font-weight: 700; }
.rp-net td { font-size: 15px; border-top: 2px solid #111827; }
.rp-wide { display: block; overflow-x: auto; }
.rp-note { font-size: 13px; color: #374151; margin: 6px 0; }
.rp-tax p { font-size: 13px; color: #374151; }
.rp-foot { margin-top: 34px; padding-top: 10px; border-top: 1px solid #E5E7EB;
  font-size: 12px; color: #9CA3AF; }
@media print {
  body.reporting > *:not(#gr-report) { display: none !important; }
  #gr-report { position: static; overflow: visible; }
  .rp-bar { display: none; }
  #gr-report section, #gr-report header, #gr-report footer { max-width: none; padding: 0; }
  #gr-report h2 { break-after: avoid; }
  .rp-table tr { break-inside: avoid; }
  .rp-table { display: table; overflow: visible; }
  .rp-table thead, .rp-table tbody { display: table-row-group; width: auto; }
}

/* ============================== Toast ============================== */
#toast { position: fixed; left: 0; right: 0; top: 0; z-index: 80; display: flex; justify-content: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; pointer-events: none; }
#toast .t {
  max-width: 540px; padding: 12px 16px; border-radius: 14px; background: var(--ink);
  color: var(--bg); font-size: 15px; font-weight: 600;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .22); opacity: 0; transform: translateY(-12px);
  transition: opacity .2s ease, transform .2s ease;
}
#toast .t.is-on { opacity: 1; transform: none; }

#minibar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px);
  background: var(--surface); border-bottom: 1px solid var(--line);
  transform: translateY(-110%); transition: transform .22s ease;
}
#minibar.is-on { transform: none; }
#minibar button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 600px; margin: 0 auto; padding: 9px 18px; border: 0; background: none; cursor: pointer; }
#minibar .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-size: 14px; font-weight: 700; }
#minibar .num { flex: none; font-size: 22px; }
#minibar[data-state="red"] .num { color: var(--neg); }
#minibar[data-state="green"] .num { color: var(--pos); }

@media (min-width: 720px) {
  .sheet {
    top: 50%; bottom: auto; border-radius: 24px; max-height: min(88vh, 800px);
    padding-bottom: 22px; transform: translateY(-46%); opacity: 0;
    transition: transform .22s ease, opacity .22s ease;
  }
  #sheet-root.open .sheet { transform: translateY(-50%); opacity: 1; }
  .odo { font-size: 74px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0ms !important; }
}
</style>
